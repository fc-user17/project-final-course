<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión - Sistema de Gestión Empresarial</title>

    <link rel="stylesheet" href="CSS/variables.css">
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/auth.css">
    <link rel="stylesheet" href="CSS/login.css">
</head>

<body class="login-body">

    <main class="login-card">

        <div class="login-header">
            <span class="login-icon">🛡️</span>
            <h1>Sistema de Gestión Empresarial</h1>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <form id="loginForm" class="login-form">

            <div class="form-group">
                <label for="usuario">Correo Electrónico</label>
                <input
                    type="email"
                    id="usuario"
                    name="usuario"
                    placeholder="ej: admin@empresa.pe"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn-login">
                Iniciar Sesión
            </button>

            <p id="mensaje" role="alert"></p>

        </form>

        <div class="demo-credentials">
            <h4>Cuentas de Acceso Demo</h4>
            <ul>
                <li><strong>Admin:</strong> <code>admin@empresa.pe</code> / <code>Admin123!</code></li>
                <li><strong>Técnico TI:</strong> <code>tecnico@empresa.pe</code> / <code>Tecnico123!</code></li>
            </ul>
        </div>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
